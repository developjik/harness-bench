name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: install
        run: npm ci

      - name: typecheck
        run: npm run typecheck

      - name: test
        run: npm test

      - name: build
        run: npm run build

      - name: cli smoke
        run: |
          node dist/bin/cli.js --version
          node dist/bin/cli.js --help > /dev/null
          node dist/bin/cli.js doctor

      - name: demo pipeline (mock harnesses, no tokens)
        run: npm run demo

      - name: upload demo report
        if: matrix.node == 22
        uses: actions/upload-artifact@v7
        with:
          name: demo-report
          path: reports/demo.html
          if-no-files-found: warn
