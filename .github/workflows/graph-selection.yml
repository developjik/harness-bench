name: Offline graph selection replay
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          path: harness-bench
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: developjik/sqlite-graph-mcp
          ref: 62335697d412dcdf6cbb41567e1e37bc224212d6
          path: sqlite-graph-71
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '22.12.0'
      - run: npm ci && npm run build
        working-directory: sqlite-graph-71
      - run: npm ci && npm run build
        working-directory: harness-bench
      - name: Export and replay without starting a driver
        working-directory: harness-bench
        run: |
          node scripts/export-selection-graph.mjs ../sqlite-graph-71 ../sqlite-graph-71 "$RUNNER_TEMP/selection-graph.json"
          node dist/bin/cli.js select --repo ../sqlite-graph-71 --graph-snapshot "$RUNNER_TEMP/selection-graph.json" --count 3 --seed 42 --out "$RUNNER_TEMP/selection-result.json"
          node scripts/check-selection-replay.mjs "$RUNNER_TEMP/selection-result.json"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: offline-selection-comparison
          path: |
            ${{ runner.temp }}/selection-graph.json
            ${{ runner.temp }}/selection-result.json
          retention-days: 7
